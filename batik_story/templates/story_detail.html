
<div class="story-detail">
    <div class="story-detail-image">
        {% if story.gambar %}
            <img
                src="{{ story.gambar.url }}"
                alt="Motif batik {{ story.nama }}"
            >
        {% else %}
            <div class="story-detail-placeholder">
                ✥ Batik Nusantara
            </div>
        {% endif %}
    </div>

    <div class="story-detail-content">
        <p class="story-detail-location">
            ⌖ {{ story.get_asal_display }}
        </p>

        <h2>{{ story.nama }}</h2>

        <section>
            <h3>Sejarah &amp; Cerita</h3>
            <p>
                {{ story.deskripsi|default:"Cerita belum tersedia."|linebreaksbr }}
            </p>
        </section>

        <section>
            <h3>Filosofi &amp; Makna</h3>
            <p>
                {{ story.filosofi|default:"Filosofi belum tersedia."|linebreaksbr }}
            </p>
        </section>
    </div>
</div>
