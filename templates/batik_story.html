{% extends "base.html" %}
{% load static %}

{% block meta %}
<title>{{ judul }} - Batik Story</title>
<link rel="stylesheet" href="{% static 'css/batik_story.css' %}">
{% endblock meta %}

{% block content %}

<section class="batik-story">
    <div class="judul">
        <h1>Batik Story</h1>
        <div class="typing-text">
            <p id="typing-text">{{ ket1 }}</p>
        </div>

        <script>
            (function () {
                const element = document.getElementById("typing-text");

                if (!element) return;

                const text = element.textContent.trim();

                element.textContent = "";

                let index = 0;
                let deleting = false;

                function typeWriter() {

                    if (!deleting) {
                        // Mengetik
                        if (index < text.length) {
                            element.textContent += text.charAt(index);
                            index++;

                            setTimeout(typeWriter, 45);
                        } else {
                            // Tunggu setelah selesai
                            setTimeout(() => {
                                deleting = true;
                                typeWriter();
                            }, 2000);
                        }

                    } else {
                        // Menghapus
                        if (index > 0) {
                            index--;
                            element.textContent = text.substring(0, index);

                            setTimeout(typeWriter, 25);
                        } else {
                            // Mulai mengetik lagi
                            deleting = false;

                            setTimeout(typeWriter, 500);
                        }
                    }
                }

                typeWriter();
            })();
        </script>

        <a href="{% url 'main:show_batik_story' %}#story-section" class="explore-btn">
            ↓ Explore
        </a>
    </div>
</section>

<section id="story-section" class="story-section">
    <h2>Discover Batik Stories</h2>
    <div class="story-cards">
        {% for batik in batiks %}
        <div class="story-card">
            <div class="card-image">
                <img src="{{ batik.gambar.url }}" alt="{{ batik.nama }}">
            </div>
            <div class="card-content">
                <div class="card-title">
                    <h3>{{ batik.nama }}</h3>
                    <label class="love">
                        <input type="checkbox">
                        <span>♡</span>
                    </label>
                </div>
                <p class="asal">{{ batik.asal }}</p>
                <a href="#" class="story-button">
                    Read Story →
                </a>
            </div>
        </div>
        {% endfor %}
    </div>
</section>

{% endblock content %}
