{% extends "base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/custom/batik_custom.css' %}">

<main class="fashion-page">
    <h2 class="fashion-eyebrow">REBATIK · STYLE DISCOVERY</h2>

    <header class="fashion-header">
        <h1>Pilih Kategori Fashion</h1>
        <p>Pilih kategori outfit yang ingin kamu eksplorasi.</p>
    </header>

    <form method="POST" action="{% url 'batik_custom:fashion_preference' %}">
        {% csrf_token %}

        <div class="fashion-grid">

            <label class="fashion-option">
                <input type="radio" name="fashion_preference" value="women" required>

                <div class="fashion-card">
                    <div class="fashion-image">
                        <img src="{% static 'img/wanitabatik.jpe' %}" alt="Fashion batik wanita">
                        <span class="fashion-check">✓</span>
                    </div>

                    <h2>Women</h2>
                    <p>Fashion perempuan</p>
                </div>
            </label>


            <label class="fashion-option">
                <input type="radio" name="fashion_preference" value="men" required>

                <div class="fashion-card">
                    <div class="fashion-image">
                        <img src="{% static 'img/priabatik.jpe' %}" alt="Fashion batik pria">
                        <span class="fashion-check">✓</span>
                    </div>

                    <h2>Men</h2>
                    <p>Fashion laki-laki</p>
                </div>
            </label>

            <label class="fashion-option">
                <input type="radio" name="fashion_preference" value="men" required>

                <div class="fashion-card">
                    <div class="fashion-image">
                        <img src="{% static 'img/batik2.png' %}" alt="Fashion batik pria">
                        <span class="fashion-check">✓</span>
                    </div>

                    <h2>Unisex</h2>
                    <p>Semua Kategori</p>
                </div>
            </label>
        </div>

        <button type="submit" class="fashion-submit">
            Lanjutkan <span>→</span>
        </button>
    </form>

</main>
{% endblock %}
