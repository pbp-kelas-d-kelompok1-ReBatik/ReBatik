<div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
    {% for design in designs %}
    <article class="rounded-2xl border border-stone-200 bg-white p-5 shadow-sm">
        <p class="text-xs uppercase tracking-widest text-amber-800">
            {{ design.layout }}
        </p>

        <h2 class="mt-2 text-xl font-semibold text-stone-900">
            {{ design.title }}
        </h2>

        <p class="mt-2 text-sm text-stone-600">
            Motif: {{ design.motif.name }}
        </p>

        {% if design.palette %}
        <p class="mt-1 text-sm text-stone-600">
            Palette: {{ design.palette.name }}
        </p>
        {% endif %}

        <div class="mt-5 flex flex-wrap gap-2">
            <a href="{% url 'batik_custom:saved_design_detail' design.pk %}"
                class="rounded-full border border-stone-300 px-4 py-2 text-sm">
                View
            </a>

            <a href="{% url 'batik_custom:saved_design_update' design.pk %}"
                class="rounded-full border border-stone-300 px-4 py-2 text-sm">
                Edit
            </a>

            <form method="post" action="{% url 'batik_custom:saved_design_delete' design.pk %}"
                hx-post="{% url 'batik_custom:saved_design_delete' design.pk %}" hx-target="#design-results"
                hx-confirm="Delete this design?">
                {% csrf_token %}
                <button type="submit" class="rounded-full bg-red-50 px-4 py-2 text-sm text-red-700">
                    Delete
                </button>
            </form>
        </div>
    </article>
    {% empty %}
    <p class="col-span-full rounded-xl bg-stone-50 p-8 text-center text-stone-600">
        No designs found. Try another filter or create your first design.
    </p>
    {% endfor %}
</div>
