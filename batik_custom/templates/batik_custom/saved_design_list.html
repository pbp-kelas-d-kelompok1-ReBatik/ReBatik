
{% extends "base.html" %}
{% load static %}

{% block content %}
<section class="mx-auto max-w-6xl px-6 py-10">
    <div class="mb-8 flex flex-wrap items-center justify-between gap-4">
        <div>
            <p class="text-sm uppercase tracking-widest text-amber-800">
                REBATIK · CREATIVE STUDIO
            </p>
            <h1 class="mt-2 text-3xl font-semibold text-stone-900">
                My Saved Designs
            </h1>
            <p class="mt-2 text-stone-600">
                Manage your personal batik creations.
            </p>
        </div>

        <a
            href="{% url 'batik_custom:saved_design_create' %}"
            class="rounded-full bg-amber-900 px-5 py-3 text-white"
        >
            + Create Design
        </a>
    </div>

    <form
        method="get"
        action="{% url 'batik_custom:saved_design_list' %}"
        hx-get="{% url 'batik_custom:saved_design_list' %}"
        hx-target="#design-results"
        hx-trigger="input changed delay:300ms from:#design-search, change from:#layout-filter, submit"
        class="mb-6 flex flex-wrap gap-3"
    >
        <input
            id="design-search"
            type="search"
            name="q"
            value="{{ query }}"
            placeholder="Search design title..."
            class="min-w-0 flex-1 rounded-lg border border-stone-300 px-4 py-3"
        >

        <select
            id="layout-filter"
            name="layout"
            class="rounded-lg border border-stone-300 px-4 py-3"
        >
            <option value="">All layouts</option>
            <option value="single" {% if selected_layout == "single" %}selected{% endif %}>Single Motif</option>
            <option value="grid" {% if selected_layout == "grid" %}selected{% endif %}>Grid</option>
            <option value="brick" {% if selected_layout == "brick" %}selected{% endif %}>Brick</option>
            <option value="half_drop" {% if selected_layout == "half_drop" %}selected{% endif %}>Half Drop</option>
            <option value="mirror" {% if selected_layout == "mirror" %}selected{% endif %}>Mirror</option>
        </select>

        <button
            type="submit"
            class="rounded-lg border border-stone-300 px-4 py-3"
        >
            Filter
        </button>
    </form>

    <div id="design-results">
        {% include "batik_custom/partials/design_results.html" %}
    </div>
</section>
{% endblock content %}
