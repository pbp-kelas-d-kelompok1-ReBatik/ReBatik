
{% extends "base.html" %}
{% load static %}

{% block content %}
<style>
    .quiz-wrapper {
        max-width: 1100px;
        margin: 50px auto;
        padding: 24px;
    }

    .vibe-card {
        background: #fffdf8;
        border-radius: 24px;
        padding: 40px;
        text-align: center;
    }

    .vibe-card h1 {
        font-size: 36px;
        margin-bottom: 10px;
        color: #704936;
    }

    .subtitle {
        color: #777;
        margin-bottom: 32px;
    }

    .style-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
    }

    .style-option {
        position: relative;
        display: block;
        cursor: pointer;
        text-align: left;
    }

    .style-option input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
    }

    .option-content {
        position: relative;
        height: 100%;
        min-height: 330px;
        padding: 12px;
        border: 2px solid #e9e4d9;
        border-radius: 18px;
        transition: border-color .2s, background .2s;
        background: #fff;
    }

    .style-option input:checked + .option-content {
        border-color: #527653;
        background: #f0f5eb;
        box-shadow: 0 0 0 2px #52765320;
    }

    .style-option input:focus-visible + .option-content {
        outline: 3px solid #527653;
        outline-offset: 3px;
    }

    .style-image,
    .image-placeholder {
        display: flex;
        width: 100%;
        height: 190px;
        object-fit: cover;
        border-radius: 12px;
        margin-bottom: 14px;
    }

    .image-placeholder {
        align-items: center;
        justify-content: center;
        background: #f1ece2;
        color: #887d6d;
        font-size: 13px;
        text-align: center;
    }

    .option-content h2 {
        font-size: 20px;
        margin: 8px 0;
        color: #704936;
    }

    .option-content p {
        color: #777;
        font-size: 13px;
        line-height: 1.5;
        margin: 6px 0;
    }

    .checkmark {
        display: none;
        position: absolute;
        z-index: 2;
        top: 18px;
        right: 18px;
        color: #527653;
        background: white;
        border-radius: 50%;
        padding: 4px 8px;
        font-weight: bold;
    }

    .style-option input:checked + .option-content .checkmark {
        display: block;
    }

    .next-button {
        margin-top: 32px;
        padding: 14px 28px;
        background: #527653;
        color: white;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        font-size: 16px;
    }

    .next-button:hover {
        background: #3e5e40;
    }

    @media (max-width: 700px) {
        .style-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .vibe-card {
            padding: 24px 14px;
        }

        .style-image,
        .image-placeholder {
            height: 150px;
        }

        .option-content {
            min-height: 280px;
        }
    }

    @media (max-width: 450px) {
        .style-grid {
            grid-template-columns: 1fr;
        }
    }
</style>

<div class="quiz-wrapper">
    <form method="POST" action="{% url 'batik_custom:select_style' %}">
        {% csrf_token %}

        <section class="vibe-card">
            <h1>What's your vibe?</h1>
            <p class="subtitle">
                Pilih gaya yang paling menggambarkan seleramu.
            </p>

            <div class="style-grid">
                {% for style in styles %}
                <label class="style-option">
                    <input
                        type="radio"
                        name="style"
                        value="{{ style.id }}"
                        required
                    >

                    <div class="option-content">
                        <span class="checkmark">✓</span>

                        {% if style.image %}
                            <img
                                src="{{ style.image.url }}"
                                alt="Outfit batik gaya {{ style.name }}"
                                class="style-image"
                            >
                        {% else %}
                            <div class="image-placeholder">
                                Foto batik belum tersedia
                            </div>
                        {% endif %}

                        <h2>{{ style.name }}</h2>
                        <p>{{ style.description }}</p>
                        <p>{{ style.detail }}</p>
                    </div>
                </label>
                {% empty %}
                    <p>
                        Belum ada pilihan gaya. Tambahkan data
                        StyleOptions melalui Django Admin.
                    </p>
                {% endfor %}
            </div>

            <button type="submit" class="next-button">
                Explore my colors →
            </button>
        </section>
    </form>
</div>
{% endblock %}
